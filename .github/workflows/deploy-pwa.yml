name: Deploy study app

# Publishes mobile/www to GitHub Pages. Open the resulting URL on your phone once,
# tap "Install app" / "Add to Home screen", and it behaves like an installed app -
# own icon, no browser chrome, fully offline afterwards.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '**/*.md'
      - '**/*.py'
      - '.github/workflows/deploy-pwa.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild the study bundle from the notes
        run: python mobile/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/www

      - id: deployment
        uses: actions/deploy-pages@v4
